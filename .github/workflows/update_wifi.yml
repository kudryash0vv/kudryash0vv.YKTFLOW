name: Update WIFI Configs

on:
  schedule:
    - cron: '30 */6 * * *' # Каждые 6 часов в 30 минут
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-wifi:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sing-box
        run: |
          SING_BOX_VERSION="1.9.3"
          curl -sSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
          rm -rf "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Run Engine for WIFI
        run: |
          # Временно подменяем источник на sources.txt для Wi-Fi перед запуском Go
          if [ -f "data/sources.txt" ]; then
            cp data/sources.txt data/sources_mobile.txt
          fi
          go run main.go

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if ! git diff --staged --quiet; then
            git commit -m "📶 WIFI Update: $(TZ="Asia/Yakutsk" date +'%Y-%m-%d %H:%M') (YKT)"
            git push
          else
            echo "Нет изменений для коммита."
          fi
