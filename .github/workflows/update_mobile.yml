name: Update Mobile Configs

on:
  schedule:
    - cron: '0 */6 * * *' # Каждые 6 часов в 00 минут
  workflow_dispatch:      # Кнопка ручного запуска

permissions:
  contents: write

jobs:
  update-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sing-box
        run: |
          SING_BOX_VERSION="1.9.3"
          curl -sSL "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz" | tar -xz
          sudo mv "sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/
          rm -rf "sing-box-${SING_BOX_VERSION}-linux-amd64"
          sing-box version

      - name: Run Go Engine & Python Checker (Mobile)
        run: |
          go run main.go

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add configs/
          if ! git diff --staged --quiet; then
            git commit -m "📱 Mobile Update: $(TZ="Asia/Yakutsk" date +'%Y-%m-%d %H:%M') (YKT)"
            git push
          else
            echo "Нет изменений для коммита."
          fi
