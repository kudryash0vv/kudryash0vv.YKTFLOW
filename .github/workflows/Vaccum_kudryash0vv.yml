name: Proxy Vacuum
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Scraper
        run: go run main.go

      - name: Push Results
        run: |
          git config --global user.name "YKT-Vacuum-Bot"
          git config --global user.email "bot@ykt.flow"
          git add configs/*.txt
          git commit -m "Auto-update configs $(date)" || exit 0
          git push
